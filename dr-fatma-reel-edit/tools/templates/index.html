<!DOCTYPE html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Dr. Fatma El Saqqa — عم حسن</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #172328; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #172328; }
      /* A-roll camera: crop/push lives on this non-timed wrapper, never on the timed <video> clips */
      #cam { position: absolute; inset: 0; transform-origin: 50% 30%; z-index: 1; }
      #cam .arole-still { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 0; }
      #cam video { z-index: 1; position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* foreground camera: subject mattes ride the exact same crop as #cam, over the behind-text layer */
      #camfg { position: absolute; inset: 0; transform-origin: 50% 30%; z-index: 3; pointer-events: none; }
      #camfg video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #host-behind { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 2; }
      .scene-host { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 10; }
      #host-captions { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 5; }
      #host-cta { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 12; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ybtk" id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
      <!-- Track 0 · A-roll: Dr. Fatma, hard-cut source ranges (see timing-map.json) -->
      <div data-hf-id="hf-3k72" id="cam">
__VIDEOS__
      </div>

      <!-- Track 9 · key phrases set behind Dr. Fatma -->
      <div id="host-behind" class="clip" data-composition-id="behind" data-composition-src="compositions/behind.html" data-start="0" data-duration="__TOTAL__" data-track-index="9" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- Track 8 · subject mattes (local u2net cut-outs of the same source frames) -->
      <div id="camfg">
__MATTES__
      </div>

      <!-- Track 2 · full-screen editorial scenes -->
__HOSTS__

      <!-- Track 3 · captions (one track) -->
      <div data-hf-id="hf-zjwa" id="host-captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="__TOTAL__" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Track 4 · CTA card (doctor stays visible) -->
      <div data-hf-id="hf-2ln7" id="host-cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="__CTA_START__" data-duration="__CTA_DUR__" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Track 5 · SFX (locally synthesized, under dialogue) -->
__SFX__
    </div>
    <script>
      const CAMS = ["#cam", "#camfg"];
      const tl = gsap.timeline({ paused: true });
      tl.set(CAMS, { scale: 1 }, 0);
      __CAM__
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
