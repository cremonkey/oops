<!doctype html>
<html>

  <body>
    <template>
      <style>
/*__BRAND__*/
        #g06-root { position: absolute; inset: 0; overflow: hidden; background: var(--cream); }
        #g06-root .g06-ghost { top: 1210px; left: -40px; font-size: 420px; }

        #g06-root .g06-lbl { font-family: "Cairo", sans-serif; font-weight: 800; font-size: 60px; color: var(--ink-soft); line-height: 1.2; }
        #g06-root .g06-row { display: flex; align-items: baseline; gap: 30px; direction: rtl; }
        #g06-root .g06-num { font-family: "Cairo", sans-serif; font-weight: 900; font-size: 300px; color: var(--teal); line-height: 1.02; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; width: 3.6ch; text-align: right; display: inline-block; }
        #g06-root .g06-unit { font-family: "Cairo", sans-serif; font-weight: 900; font-size: 96px; color: var(--ink); }

      </style>
      <div id="g06-root" data-composition-id="g06-weight" data-width="1080" data-height="1920">
        <div class="fs-paper"><div class="fs-grid"></div><div data-layout-ignore aria-hidden="true" class="fs-ghost g06-ghost">كيلو</div></div>

        <div class="fs-grain"></div>

      <script>
        (function () {
          const C = __CUES__;
          const D = __DUR__;
          const q = (s) => document.querySelector("#g06-root " + s);
          const curve = q(".g06-curve");
          const L = curve.getTotalLength();
          const num = q(".g06-num");
          const counter = { v: 140 };
          const land = Math.max(0.6, C.land);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".g06-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, 0);
          tl.fromTo(q(".fs-top"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, 0.02);
          tl.fromTo(q(".g06-from"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, 0);
          tl.fromTo(q(".g06-p0"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.22, ease: "back.out(1.6)" }, 0.08);
          tl.fromTo(q(".g06-main"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.06);
          tl.fromTo(curve, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: land, ease: "power2.out" }, 0.1);
          tl.fromTo(counter, { v: 140 }, { v: 87, duration: land, ease: "power2.out", onUpdate: () => { num.textContent = String(Math.round(counter.v)); } }, 0.1);
          tl.fromTo(q(".g06-p1"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.24, ease: "back.out(1.6)" }, land + 0.06);
          tl.fromTo(num, { scale: 1, transformOrigin: "100% 60%" }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, land + 0.08);
          tl.fromTo(q(".g06-strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, land + 0.12);
          tl.fromTo(q(".g06-alt"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.24, ease: "power2.out" }, C.alt - 0.04);
          tl.fromTo(q(".g06-note"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, land + 0.3);
          tl.fromTo(q(".g06-ghost"), { x: 0 }, { x: 50, duration: D, ease: "none" }, 0);
          tl.fromTo(q(".g06-chart"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.04, duration: D, ease: "none" }, 0);
          tl.fromTo(q(".fs-grid"), { y: 0 }, { y: -36, duration: D, ease: "none" }, 0);
          window.__timelines["g06-weight"] = tl;
        })();
