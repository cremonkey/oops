<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
/*__BRAND__*/
        #captions-root { position: absolute; inset: 0; pointer-events: none; }
        #cap-scrim { position: absolute; left: 0; right: 0; top: 1080px; height: 700px;
          background: linear-gradient(180deg, rgba(23, 35, 40, 0) 0%, rgba(23, 35, 40, 0.42) 42%, rgba(23, 35, 40, 0.5) 62%, rgba(23, 35, 40, 0) 100%); }
        #cap-loop { position: absolute; left: 190px; width: 700px; top: 1236px; height: 8px; border-radius: 4px; background: var(--teal-soft); }
        .cap { position: absolute; left: 80px; right: 80px; top: 1282px; height: 130px; display: flex; align-items: center; justify-content: center; opacity: 0; }
        .cap-line { font-family: "Cairo", sans-serif; font-weight: 800; font-size: 84px; line-height: 1.2; color: var(--caption); direction: rtl; text-align: center; white-space: nowrap;
          text-shadow: 0 3px 18px rgba(23, 35, 40, 0.55), 0 1px 2px rgba(23, 35, 40, 0.6); letter-spacing: -0.01em; }
        .cap-w { display: inline-block; position: relative; }
        .cap-hl { padding: 0 0.16em; margin: 0 0.02em; }
        .cap-hlbg { position: absolute; left: 0; right: 0; top: 0.12em; bottom: 0.02em; border-radius: 0.16em; transform-origin: 100% 50%; display: block; }
        .cap-txt { position: relative; display: inline-block; }
      </style>
      <div id="captions-root" data-composition-id="captions" data-width="1080" data-height="1920">
        <div id="cap-scrim"></div>
        <div id="cap-loop"></div>
        <div id="cap-stack"></div>
      </div>
      <script>
        (function () {
          const CAPS = __CAPS__;
          const TOTAL = __DUR__;
          const TONES = { teal: ["#167493", "#FFFDF8"], warm: ["#D98245", "#172328"], green: ["#7B9B72", "#172328"], "": ["#167493", "#FFFDF8"] };
          const stack = document.getElementById("cap-stack");
          const tl = gsap.timeline({ paused: true });
          CAPS.forEach((c) => {
            const box = document.createElement("div");
            box.className = "cap";
            box.id = "captions-" + c.id;
            const line = document.createElement("div");
            line.className = "cap-line";
            c.words.forEach((w, k) => {
              const s = document.createElement("span");
              s.className = "cap-w" + (w.hl ? " cap-hl" : "");
              const txt = document.createElement("span");
              txt.className = "cap-txt";
              txt.textContent = w.t;
              if (w.hl) {
                const bg = document.createElement("span");
                bg.className = "cap-hlbg";
                const [fill, ink] = TONES[c.tone];
                bg.style.background = fill;
                s.appendChild(bg);
                tl.set(bg, { scaleX: 0 }, 0);
                const at = c.start + Math.max(0, w.at - 0.03);
                tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.13, ease: "power3.out", immediateRender: false }, at);
                tl.set(txt, { color: ink, textShadow: "none" }, at + 0.03);
              }
              s.appendChild(txt);
              line.appendChild(s);
              if (k < c.words.length - 1) line.appendChild(document.createTextNode(" "));
            });
            box.appendChild(line);
            stack.appendChild(box);
            tl.fromTo(box, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, c.start);
            tl.set(box, { opacity: 0 }, c.end);
          });
          // loop seam: the line retracts at frame 0 and re-grows into the final frame
          tl.fromTo("#cap-loop", { scaleX: 1, transformOrigin: "0% 50%" }, { scaleX: 0, duration: 0.5, ease: "power2.in" }, 0);
          tl.fromTo("#cap-loop", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.42, ease: "power2.out", immediateRender: false }, TOTAL - 0.45);
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
