<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
/*__BRAND__*/
        #__SID__-root { position: absolute; inset: 0; overflow: hidden; background: #172328; }
        #__SID__-root .rb-cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
        #__SID__-root .rb-cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
        #__SID__-root .rb-shade { position: absolute; left: 0; right: 0; top: 980px; bottom: 0; background: linear-gradient(180deg, rgba(23, 35, 40, 0) 0%, rgba(23, 35, 40, 0.55) 38%, rgba(23, 35, 40, 0.78) 100%); }
        #__SID__-root .rb-top { position: absolute; left: 0; right: 0; top: 0; height: 320px; background: linear-gradient(180deg, rgba(23, 35, 40, 0.45) 0%, rgba(23, 35, 40, 0) 100%); }
        #__SID__-root .rb-tag { position: absolute; top: 160px; right: 90px; direction: rtl; font-family: "Cairo", sans-serif; font-weight: 700; font-size: 28px; color: rgba(255, 253, 248, 0.86); display: flex; align-items: center; gap: 12px; }
        #__SID__-root .rb-tag i { width: 12px; height: 12px; border-radius: 50%; background: var(--teal-soft); display: block; }
        #__SID__-root .rb-text { position: absolute; left: 90px; right: 90px; top: 1250px; direction: rtl; text-align: right; }
        #__SID__-root .rb-kicker { font-family: "Cairo", sans-serif; font-weight: 800; font-size: 54px; line-height: 1.25; color: rgba(255, 253, 248, 0.9); }
        #__SID__-root .rb-main { font-family: "Cairo", sans-serif; font-weight: 900; font-size: 118px; line-height: 1.1; color: var(--caption); letter-spacing: -0.02em; white-space: nowrap; }
        #__SID__-root .rb-bar { width: 220px; height: 12px; border-radius: 6px; background: var(--teal); margin: 18px 0 0 auto; transform-origin: 100% 50%; }
      </style>
      <div id="__SID__-root" data-composition-id="__SCENE__" data-width="1080" data-height="1920">
        <div class="rb-cam"><video id="__SID__-v" class="clip" src="__SRC__" data-start="0" data-duration="__DUR__" data-media-start="0" data-track-index="0" muted playsinline></video></div>
        <div class="rb-top"></div>
        <div class="rb-shade"></div>
        <div class="rb-tag"><i></i>مشهد تمثيلي</div>
        <div class="rb-text">
          <div class="fs-mask"><div class="fs-line rb-kicker" data-layout-allow-overflow>__KICKER__</div></div>
          <div class="fs-mask"><div class="fs-line rb-main" data-layout-allow-overflow>__MAIN__</div></div>
          <div class="rb-bar"></div>
        </div>
      </div>
      <script>
        (function () {
          const C = __CUES__;
          const D = __DUR__;
          const q = (s) => document.querySelector("#__SID__-root " + s);
          const main = q(".rb-main");
          if (main.textContent.length > 12) main.style.fontSize = "92px";
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".rb-cam"), { scale: 1.0 }, { scale: 1.07, duration: D, ease: "none" }, 0);
          tl.fromTo(q(".rb-tag"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.05);
          tl.fromTo(q(".rb-kicker"), { yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, Math.max(0, C.text - 0.25));
          tl.fromTo(q(".rb-main"), { yPercent: 105 }, { yPercent: 0, duration: 0.34, ease: "power3.out" }, Math.max(0.06, C.text - 0.1));
          tl.fromTo(q(".rb-bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, Math.max(0.12, C.text + 0.05));
          window.__timelines["__SCENE__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
