<!doctype html>
<meta charset="utf-8">
<title>9k montage overlay</title>
<!-- Fonts are local (npm @fontsource) so headless renders never depend on the network -->
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-serif/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-mono/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans-arabic/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans-arabic/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans-arabic/700.css">
<style>
  html,body{margin:0;background:transparent}canvas{display:block}
  body.preview{background:#0F0F0F;display:grid;place-items:center;height:100vh;overflow:hidden}
  .stage{position:relative}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
  .stage video{object-fit:cover}
</style>
<canvas id="c"></canvas>
<script src="lib/motion.js"></script>
<script src="lib/brand.js"></script>
<script src="lib/overlay.js"></script>
<!-- Written by scripts/render-overlay.mjs from edit.json + work/captions.json -->
<script src="work/edit.data.js"></script>
<script>
const D = window.EDIT, W = D.format.w, H = D.format.h;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const AR_FACES = ['400 32px "IBM Plex Sans Arabic"', '600 32px "IBM Plex Sans Arabic"', '700 32px "IBM Plex Sans Arabic"'];
window.DUR = D.duration;
window.ready = Promise.all([B.loadFonts(), ...AR_FACES.map((f) => document.fonts.load(f, 'عربي'))]).then(() => O.init(g, D));
window.seek = (t) => O.draw(t, D);
window.cues = () => O.cues(D);

// Live preview in a normal browser: the cut footage plays under the overlay. Scrub with the video controls.
if (!navigator.webdriver) window.ready.then(() => {
  document.body.className = 'preview';
  const stage = document.createElement('div'); stage.className = 'stage';
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.96; stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px';
  const v = document.createElement('video'); v.src = 'work/cut.proxy.mp4'; v.controls = true; v.playsInline = true;
  document.body.append(stage); stage.append(v, cv); cv.style.pointerEvents = 'none';
  (function loop() { O.draw(v.currentTime, D); requestAnimationFrame(loop); })();
});
</script>
